version: '3.8'

services:
  # La base de données PostgreSQL
  db:
    image: postgres:15
    container_name: wedding_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wedding_db
    ports:
      - "5432:5432"

  # Ton backend FastAPI
  backend:
    build: ./backend
    container_name: wedding_api
    volumes:
      - ./backend:/app
      - /app/.venv  # Astuce : Crée un volume anonyme pour éviter que le .venv Windows n'écrase celui du conteneur
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://user:password@db:5432/wedding_db
      - SECRET_KEY=${SECRET_KEY:-mdp123}
      - ALGORITHM=${ALGORITHM:-HS256}
      - PROJECT_NAME=${PROJECT_NAME:-WeddingInvitationSaas}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      # URL du front pour les redirections Stripe (HTTPS en dev — voir mkcert)
      - FRONTEND_URL=${FRONTEND_URL:-https://localhost:5173}
    # On force la commande de démarrage ici pour être sûr du chemin
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --ssl-keyfile=/app/certs/localhost-key.pem --ssl-certfile=/app/certs/localhost.pem
    ports:
      - "8000:8000"
    depends_on:
      - db

  # Interface graphique Web pour la BDD
  adminer:
    image: adminer
    container_name: wedding_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

  # Frontend Vue.js
  frontend:
    build: 
      context: ./frontend
      target: build-stage
    container_name: wedding_ui
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=https://localhost:8000
    depends_on:
      - backend